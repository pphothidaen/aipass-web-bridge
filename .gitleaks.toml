# gitleaks config: extend the default rules with a targeted allowlist.
#
# Since v0.6.2 the extension source carries only the __BRIDGE_AUTH_TOKEN__
# placeholder (token injected at build time by scripts/build-extension.py),
# so the extension/release path allowlists are gone on purpose — any literal
# token there is a leak and must fail the blue-team gate. The remaining
# allowlist only covers historical references in docs/changelog.
[extend]
useDefault = true

[allowlist]
description = "Historical references to the retired v0.5.5 default tokens in docs and changelog only."
paths = [
  '''^CHANGELOG\.md$''',
  '''^docs/''',
]
regexes = [
  '''aipass-bridge-secret-2026''',
  '''hermes-secret-key-2026''',
]
