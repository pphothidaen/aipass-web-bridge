name = "aipass-bridge-cloud-hub"
main = "worker.js"
compatibility_date = "2024-11-01"

[durable_objects]
bindings = [{ name = "EXT_HUB", class_name = "ExtHub" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ExtHub"]

# After deploy:
#   wrangler secret put BRIDGE_TOKEN
# Then set the same token on the Chrome extension (x-bridge-token / popup URL)
# and point Hermes' aipass-bridge provider base_url at https://<name>.workers.dev/v1
