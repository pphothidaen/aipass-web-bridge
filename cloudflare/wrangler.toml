name = "aipass-web-bridge"
main = "worker.js"
compatibility_date = "2024-11-01"

[durable_objects]
bindings = [{ name = "EXT_HUB", class_name = "ExtHub" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ExtHub"]

# Secrets already set on this worker via the Cloudflare dashboard:
#   BRIDGE_SECRET   (aipass-bridge-secret-2026)  → extension channel /ext/*
#   CLIENT_API_KEY  (hermes-secret-key-2026)     → API/MCP clients
# Chrome extension popup: Bridge URL = https://aipass-web-bridge.<account>.workers.dev
# Hermes provider base_url = https://aipass-web-bridge.<account>.workers.dev/v1
