name: AiPASS Checks
on: [pull_request]

jobs:
  no-hardcoded-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
        working-directory: packages/core/aipass-bridge
      - run: node packages/checks-runner/run-check.js .aipass/checks/no-hardcoded-secrets.md