name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check worker + shipped extension (release copy)
        run: |
          node --check cloudflare/worker.js
          node --check release/chrome-extension/background.js
          node --check release/chrome-extension/popup.js
          python3 -m py_compile secretary.py
      - name: Note — packages/core is a git submodule (own history, public fork)
        run: echo "packages/core is checked out via submodule; CI validates worker, release copy, and the nested test suites."
      - name: Live smoke gate (prod must answer JSON, not Hello World)
        run: |
          ST=$(curl -s --max-time 15 https://aipass-web-bridge.taijustarrett417.workers.dev/status)
          echo "$ST" | grep -q '"service": *"aipass-web-bridge"' || (echo "PROD SMOKE FAILED: $ST" && exit 1)

  blueteam:
    # Defensive security gate — mirrors gemini-web-bridge ci.yml:
    # secret-leak scan + dependency audit + secret-hygiene assertions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Secret leak scan (gitleaks, commits + working tree)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency audit (high severity or worse)
        run: |
          npm audit --omit=dev --audit-level=high || true
          npm audit --prefix packages/core/aipass-bridge --omit=dev --audit-level=high || true
      - name: Worker must not carry hard-coded tokens
        run: |
          if grep -nE 'aipass-bridge-secret-2026|hermes-secret-key-2026' cloudflare/worker.js cloudflare/wrangler.toml; then
            echo "::error::hard-coded token literal found in worker/wrangler config"; exit 1
          fi
          echo "worker secret hygiene OK"

  redteam:
    # Offensive security gate — adversarial suites + auth unit coverage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests (worker + config precedence + fallback agent)
        run: npm test
      - name: Red-team adversarial suite (bridge, chat, page)
        run: node --test packages/core/aipass-bridge/test/bridge.test.mjs packages/core/aipass-bridge/test/chat.test.mjs packages/core/aipass-bridge/test/page.test.mjs
      - name: SSRF / redirect guard suite
        run: node --test packages/core/aipass-bridge/test/ssrf.test.mjs

  deploy:
    needs: [smoke, blueteam, redteam]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Guard — run only when CLOUDFLARE_API_TOKEN secret is set
        id: guard
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN not set — skipping deploy (add it via gh secret set)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy worker
        if: steps.guard.outputs.skip == 'false'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare
      - name: Post-deploy smoke
        if: steps.guard.outputs.skip == 'false'
        run: |
          sleep 5
          curl -s --max-time 15 https://aipass-web-bridge.taijustarrett417.workers.dev/status | grep -q '"ok": *true' || (echo "POST-DEPLOY FAILED" && exit 1)

      - name: Build extension + zip artifact
        if: steps.guard.outputs.skip == 'false'
        env:
          BRIDGE_AUTH_TOKEN: ${{ secrets.BRIDGE_AUTH_TOKEN }}
        run: |
          # Build Chrome extension with injected token
          python3 scripts/build-extension.py --output release/aipass-bridge-chrome-built
          # Create versioned zip (e.g. aipass-bridge-v0.6.5.zip)
          VERSION=$(node -p "require('./release/aipass-bridge-chrome-built/manifest.json').version")
          cd release/aipass-bridge-chrome-built
          zip -qr ../aipass-bridge-v${VERSION}.zip .
          cd ../..
          echo "Created: release/aipass-bridge-v${VERSION}.zip"
          ls -la release/aipass-bridge-v*.zip

      - name: Upload extension artifact
        if: steps.guard.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: aipass-bridge-extension
          path: release/aipass-bridge-v*.zip
          retention-days: 30
